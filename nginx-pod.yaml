apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app.kubernetes.io/name: nginx-pod
spec:
  containers:
  - name: nginx-container
    image: nginx:1.19.1
    ports:
      - containerPort: 80
        name: http
    volumeMounts:
      - name:  nginx-config
        mountPath:  /etc/nginx/conf.d/default.conf
        subPath: nginx.conf
  - name: nginx-explorer
    image: 'nginx/nginx-prometheus-exporter:0.11.0'
    args:
      - '-nginx.scrape-uri=http://localhost/metrics'
    resources:
      requests:
        memory: 128Mi
        cpu: "0.3"
      limits:
        memory: 128Mi
        cpu: "0.3"
    ports:
      - containerPort: 9113
        name: metrics
  volumes:
    - configMap:
        defaultMode: 420
        name: nginx-config
      name: nginx-config
