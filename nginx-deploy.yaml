apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-server
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 2
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      containers:
        - name: nginx
          image: nginx:1.19.1
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
        - name: nginx-explorer
          image: "nginx/nginx-prometheus-exporter:0.11.0"
          args:
            - "-nginx.scrape-uri=http://localhost/metrics"
          resources:
            limits:
              memory: 128Mi
              cpu: "0.3"
            requests:
              memory: 128Mi
              cpu: "0.3"
          ports:
            - name: metrics
              containerPort: 9113
      volumes:
        - configMap:
            defaultMode: 420
            name: nginx-config
          name: nginx-config
